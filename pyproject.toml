[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fileaudit"
dynamic = ["version"] # This tells Hatch that version is dynamically determined
description = 'Python file security validator.'
readme = "README.md"
dependencies = ["fire==0.7.1"]
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
keywords = ["Security", "Audit", "Software Development", "appsec" , "SecurityByDesign"]
authors = [
  { name = "Maikel Mardjan", email = "mike@bm-support.org" },
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Security",  
  "Topic :: Software Development :: Quality Assurance",  
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",  
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "black"]

[project.urls]
Homepage = "https://github.com/nocomplexity/fileaudit"
Documentation = "https://github.com/nocomplexity/fileaudit#readme"
Issues = "https://github.com/nocomplexity/fileaudit/issues"
Source = "https://github.com/nocomplexity/fileaudit"

[tool.hatch.version]
path = "src/fileaudit/__about__.py"


[tool.hatch.build.targets.wheel]
packages = ["src/fileaudit"]


[project.scripts]
fileaudit = "fileaudit.cli:main"


[tool.hatch.envs.types]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.14", "3.13", "3.12"]

[tool.hatch.envs.hatch-test]
randomize = true
dependencies = ["pytest", "pytest-cov", "coverage"]

[tool.coverage.run]
branch = true
source = ["src/fileaudit"]

[tool.coverage.report]
show_missing = true

[tool.hatch.envs.hatch-static-analysis]
dependencies = ["black", "pylint"]


