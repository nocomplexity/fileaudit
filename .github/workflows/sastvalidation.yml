# SAST scan with Python Code Audit (https://github.com/nocomplexity/codeaudit) on GitHub Actions

name: Python Code Audit SAST Scan

on:
  push:
  pull_request:

jobs:
  codeaudit-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python Code Audit
        run: pip install codeaudit

      - name: Show version
        run: codeaudit --version

      - name: Run SAST scan
        run: |
          codeaudit cimode . --output text | tee codeaudit-output.text
          exit ${PIPESTATUS[0]}

      - name: Upload scan artifact
        uses: actions/upload-artifact@v5
        with:
          name: codeaudit-${{ github.ref_name }}
          path: codeaudit-output.text