name: File Audit Validation Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip hatch

      - name: Run tests
        run: hatch test -ar