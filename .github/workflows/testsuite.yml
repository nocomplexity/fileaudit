name: File Audit Validation Tests

on:
  push:
    paths:
      - "src/fileaudit/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/fileaudit/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip hatch

      - name: Run tests
        run: hatch test -ar